<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Furs and Coats</title>
    <link rel="StyleSheet" href="{% static 'css/registration.css'%}"/>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo">
                <a href="{% url 'index' %}">Furs and Coats</a>
            </div>
            <nav class="main-nav">
                <a href="{% url 'index' %}" class="nav-link">Главная</a>
                <a href="{% url 'catalog' %}" class="nav-link active">Каталог</a>
                <a href="{% url 'cart' %}" class="nav-link">Корзина</a>
                <a href="#" class="nav-link">Оплата</a>
            </nav>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Создать аккаунт</h1>
                <p>Заполните форму для регистрации</p>
            </div>
            
            <form class="auth-form" method="POST" action="{% url 'registration' %}">
                {% csrf_token %}
                {% if error_message %}
                <div class="error-message" style="background: rgba(244, 67, 54, 0.1); color: #f44336; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(244, 67, 54, 0.3);">
                    {{ error_message }}
                </div>
                {% endif %}
                {% if success_message %}
                <div class="success-message" style="background: rgba(76, 175, 80, 0.1); color: #4caf50; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(76, 175, 80, 0.3);">
                    {{ success_message }}
                </div>
                {% endif %}
                
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Введите имя пользователя"
                        required
                        autocomplete="username"
                        value="{{ form_data.username|default:'' }}"
                    >
                </div>
                
                <div class="form-group">
                    <label for="first_name">Имя</label>
                    <input 
                        type="text" 
                        id="first_name" 
                        name="first_name" 
                        placeholder="Введите ваше имя"
                        required
                        autocomplete="given-name"
                        value="{{ form_data.first_name|default:'' }}"
                    >
                </div>
                
                <div class="form-group">
                    <label for="last_name">Фамилия</label>
                    <input 
                        type="text" 
                        id="last_name" 
                        name="last_name" 
                        placeholder="Введите вашу фамилию"
                        required
                        autocomplete="family-name"
                        value="{{ form_data.last_name|default:'' }}"
                    >
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Введите ваш email"
                        required
                        autocomplete="email"
                        value="{{ form_data.email|default:'' }}"
                    >
                </div>
                
                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        placeholder="+7 (999) 123-45-67"
                        autocomplete="tel"
                        value="{{ form_data.phone|default:'' }}"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Введите пароль"
                        required
                        autocomplete="new-password"
                    >
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Подтвердите пароль</label>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        placeholder="Повторите пароль"
                        required
                        autocomplete="new-password"
                    >
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="agree" required>
                        <span>Я согласен с <a href="#" class="terms-link">условиями использования</a></span>
                    </label>
                </div>
                
                <button type="submit" class="submit-btn">
                    <span>Зарегистрироваться</span>
                </button>
                
                <div class="auth-footer">
                    <p>Уже есть аккаунт? <a href="{% url 'index' %}" class="login-link">Войти</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
